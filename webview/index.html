<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viewlife Markdown</title>
</head>

<body>
  <main>
    <header class="toolbar">
      <div class="app-title">Viewlife</div>

      <div class="toolbar-actions">
        <div class="theme-switch" role="group" aria-label="Theme">
          <button type="button" class="theme-option" data-theme-mode="system" aria-pressed="true" title="Follow VS Code theme" aria-label="Follow VS Code theme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5" /><path d="M12 4.5v15a7.5 7.5 0 0 0 0-15Z" class="filled" /></svg>
          </button>
          <button type="button" class="theme-option" data-theme-mode="light" aria-pressed="false" title="Light" aria-label="Light theme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4" /></svg>
          </button>
          <button type="button" class="theme-option" data-theme-mode="dark" aria-pressed="false" title="Dark" aria-label="Dark theme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" /></svg>
          </button>
        </div>
        <span class="toolbar-separator" aria-hidden="true"></span>
        <button type="button" id="export-pdf" class="toolbar-button" title="Save the rendered Markdown as a PDF">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14" /></svg>
          <span>Export PDF</span>
        </button>
        <div class="style-menu">
          <button
            type="button"
            id="style-menu-toggle"
            class="toolbar-button"
            aria-label="Open style menu"
            aria-expanded="false"
            aria-controls="style-menu-panel"
            title="Styles"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2" /><circle cx="10" cy="17" r="2" /></svg>
            <span>Styles</span>
          </button>
          <section id="style-menu-panel" class="style-menu-panel" aria-label="Styles" hidden>
            <div class="style-menu-section">
              <h2>CSS profile</h2>
              <div class="profile-actions" role="group" aria-label="CSS profile">
                <button type="button" class="profile-button" data-profile="basic" aria-pressed="true">
                  Basic
                </button>
                <button type="button" class="profile-button" data-profile="github" aria-pressed="false">
                  GitHub
                </button>
                <button type="button" class="profile-button" data-profile="gitlab" aria-pressed="false">
                  GitLab
                </button>
                <button type="button" class="profile-button" data-profile="vscode" aria-pressed="false">
                  VS Code
                </button>
              </div>
            </div>

            <div class="css-preview-container">
              <h3>Live preview</h3>
              <iframe
                id="custom-css-preview"
                title="Live preview of selected CSS profile"
                sandbox
              ></iframe>
            </div>

            <div class="style-menu-section">
              <div class="custom-css-header">
                <div>
                  <h2>Custom CSS</h2>
                  <p>Apply custom CSS temporarily. Choose a profile or restore the preset to return.</p>
                </div>
                <div class="custom-css-actions">
                  <input id="custom-css-file" type="file" accept=".css,text/css" hidden />
                  <button type="button" id="import-css">Import your own CSS</button>
                  <button type="button" id="load-css-example">Load Basic CSS</button>
                  <button type="button" id="export-css-template">Export CSS template</button>
                  <button type="button" id="apply-custom-css" aria-pressed="false">Apply to paper</button>
                </div>
              </div>
              <div class="custom-css-workbench">
                <label class="css-editor-label" for="custom-css-editor">CSS editor</label>
                <textarea id="custom-css-editor" spellcheck="false" aria-label="Custom CSS"></textarea>
              </div>
              <p id="custom-css-status" role="status" aria-live="polite"></p>
            </div>
          </section>
        </div>
      </div>
    </header>

    <section class="paper" id="paper" data-theme="light">
      <div id="editor" role="textbox" aria-label="Markdown editor" aria-multiline="true" spellcheck="false">
      </div>
    </section>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
